[project]
name = "qhack"
version = "0.1.0"
description = "COMS 4995W Lab-to-Market: Quantum & AI - hackathon workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    # Capped: Windows Smart App Control blocks the unsigned DLLs of brand-new numpy
    # releases until they build reputation. Raise the cap once a newer one loads.
    "numpy>=2.0,<2.5",
    "scipy",
    "matplotlib",
    "pylatexenc",
    "python-dotenv",
    "qiskit-algorithms>=0.4.0",
    "qiskit-optimization>=0.7.0",
    "qiskit-nature>=0.8.0",
    "qiskit-machine-learning>=0.9.1",
    "networkx>=3.6.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "stim>=1.16.0",
    "pymatching>=2.4.0",
    "pennylane>=0.45.1",
    "openfermion>=1.8.1",
    "quimb>=1.15.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qhack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: noisy-simulator tests that take longer"]

[tool.ruff]
line-length = 100
